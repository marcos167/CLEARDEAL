<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Teste de Cadastro ClearDeal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 4px;
        }

        button {
            background: #1a56db;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body>
    <h1>🧪 Teste de Cadastro - ClearDeal</h1>
    <p>Use este formulário para testar se o Supabase está configurado corretamente.</p>

    <form id="testForm">
        <div class="form-group">
            <label>Nome Completo:</label>
            <input type="text" id="fullName" value="Teste Usuario" required>
        </div>

        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" value="teste@cleardeal.com" required>
        </div>

        <div class="form-group">
            <label>Senha:</label>
            <input type="password" id="password" value="senha123456" required>
        </div>

        <button type="submit">📝 Testar Cadastro</button>
    </form>

    <div id="status"></div>

    <hr>
    <h3>Configuração Supabase:</h3>
    <pre id="config"></pre>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const statusDiv = document.getElementById('status');
        const configDiv = document.getElementById('config');

        // Configuração
        const SUPABASE_URL = 'https://gjpmhgqdqnqgjwwaljkx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqcG1oZ3FkcW5xZ2p3d2Fsamt4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5NDM5MTEsImV4cCI6MjA4MjUxOTkxMX0.p1-FND-PRllv9zzvsB06YCBDfbk2P2yJ2CG9te8UmAY';

        // Mostrar configuração
        configDiv.textContent = `URL: ${SUPABASE_URL}\nKey: ${SUPABASE_ANON_KEY.substring(0, 20)}...`;

        // Criar cliente
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        console.log('✅ Supabase client criado');

        // Testar conexão
        async function testConnection() {
            try {
                const { data, error } = await supabaseClient.from('profiles').select('count');
                console.log('Conexão teste:', { data, error });
            } catch (e) {
                console.log('Erro na conexão:', e);
            }
        }
        testConnection();

        // Form submit
        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            statusDiv.style.display = 'block';
            statusDiv.className = '';
            statusDiv.textContent = '⏳ Tentando cadastrar...';

            console.log('📝 Tentando signup:', { email, fullName });

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullName
                        },
                        emailRedirectTo: window.location.origin + '/app.html'
                    }
                });

                console.log('Resposta signup:', { data, error });

                if (error) {
                    throw error;
                }

                statusDiv.className = 'success';
                statusDiv.innerHTML = `
                    <strong>✅ SUCESSO!</strong><br>
                    Usuário criado: ${data.user?.email}<br>
                    ID: ${data.user?.id}<br>
                    <br>
                    <strong>Verifique:</strong><br>
                    1. Supabase Dashboard → Users<br>
                    2. Seu email (se confirmação ativada)<br>
                    <br>
                    <em>Console do navegador tem mais detalhes (F12)</em>
                `;

            } catch (error) {
                console.error('❌ Erro:', error);

                statusDiv.className = 'error';
                statusDiv.innerHTML = `
                    <strong>❌ ERRO NO CADASTRO:</strong><br>
                    ${error.message}<br>
                    <br>
                    <strong>Possíveis causas:</strong><br>
                    • Email já cadastrado<br>
                    • Senha muito fraca<br>  
                    • Configuração incorreta<br>
                    • URL ou Key errados<br>
                    <br>
                    <strong>Verifique o Console (F12) para mais detalhes</strong>
                `;
            }
        });
    </script>
</body>

</html>
