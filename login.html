<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ClearDeal</title>
    <meta name="description" content="Entre na sua conta ClearDeal">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="logo.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--color-primary-light) 0%, var(--color-primary) 100%);
            padding: 2rem;
        }

        .auth-card {
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            max-width: 400px;
            width: 100%;
        }

        .auth-logo {
            display: block;
            margin: 0 auto 2rem;
            max-width: 200px;
        }

        .auth-title {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--color-primary);
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .auth-input {
            padding: 1rem;
            border: 2px solid var(--color-gray-light);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .auth-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .auth-button {
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .auth-button-primary {
            background: var(--color-primary);
            color: white;
        }

        .auth-button-primary:hover {
            background: var(--color-primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .auth-button-google {
            background: white;
            color: var(--color-text);
            border: 2px solid var(--color-gray-light);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .auth-button-google:hover {
            background: var(--color-gray-light);
        }

        .auth-divider {
            text-align: center;
            margin: 1.5rem 0;
            position: relative;
        }

        .auth-divider::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: var(--color-gray-light);
        }

        .auth-divider span {
            background: white;
            padding: 0 1rem;
            position: relative;
            color: var(--color-text-secondary);
        }

        .auth-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--color-text-secondary);
        }

        .auth-link a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        .auth-error {
            background: var(--color-danger-light);
            color: var(--color-danger);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .auth-error.show {
            display: block;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <a href="/index.html">
                <img src="logo.png" alt="ClearDeal" class="auth-logo">
            </a>

            <h1 class="auth-title">Entre na sua conta</h1>

            <div id="authError" class="auth-error"></div>

            <button id="googleLogin" class="auth-button auth-button-google">
                <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg">
                    <g fill="#000" fill-rule="evenodd">
                        <path
                            d="M9 3.48c1.69 0 2.83.73 3.48 1.34l2.54-2.48C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l2.91 2.26C4.6 5.05 6.62 3.48 9 3.48z"
                            fill="#EA4335"></path>
                        <path
                            d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"
                            fill="#4285F4"></path>
                        <path
                            d="M3.88 10.78A5.54 5.54 0 0 1 3.58 9c0-.62.11-1.22.29-1.78L.96 4.96A9.008 9.008 0 0 0 0 9c0 1.45.35 2.82.96 4.04l2.92-2.26z"
                            fill="#FBBC05"></path>
                        <path
                            d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.4-1.57-5.12-3.74L.97 13.04C2.45 15.98 5.48 18 9 18z"
                            fill="#34A853"></path>
                    </g>
                </svg>
                Entrar com Google
            </button>

            <div class="auth-divider">
                <span>ou</span>
            </div>

            <form id="loginForm" class="auth-form">
                <input type="email" id="email" class="auth-input" placeholder="Email" required autocomplete="email">
                <input type="password" id="password" class="auth-input" placeholder="Senha" required
                    autocomplete="current-password">
                <button type="submit" class="auth-button auth-button-primary">
                    Entrar
                </button>
            </form>

            <div class="auth-link">
                Não tem conta? <a href="/signup.html">Cadastre-se grátis</a>
            </div>

            <div class="auth-link">
                <a href="/forgot-password.html">Esqueceu sua senha?</a>
            </div>
        </div>
    </div>

    <script type="module" src="login.js"></script>
</body>

</html>
